services:
  postgres:
    image: postgres:16-alpine
    container_name: munich_dwh_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh}
      POSTGRES_DB: ${POSTGRES_DB:-munich_retail}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwh} -d ${POSTGRES_DB:-munich_retail}" ]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: munich_dwh_adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
