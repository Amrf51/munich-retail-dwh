[project]
name = "munich-retail-dwh"
version = "0.1.0"
description = "Dimensional warehouse and ELT pipeline for Munich retail sales"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pandas>=2.2"]

[project.scripts]
munich-dwh = "munich_dwh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munich_dwh"]

[tool.ruff]
line-length = 100
